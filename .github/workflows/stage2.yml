# Build the self-hosted compiler for people to try: stage 1 is compiled by the
# reference (Haskell) compiler from TimWhiting/koka `dev-compiler2` -- the
# branch that carries every fix the port needs, ahead of upstream -- and stage 2 is the
# port compiled by stage 1. Stage 2 is what ships.
#
# A release is a directory `koka-port-<os>-<arch>/` holding `bin/koka`, `lib`
# (the standard library sources) and `kklib` (the C runtime sources): the
# compiler finds its share directory as the prefix of its own `bin/`, so the
# archive works wherever it is extracted.
#
# Windows is not built: the port drives the C compiler through a POSIX shell.
name: stage2

on:
  workflow_dispatch:
    inputs:
      koka-ref:
        description: "TimWhiting/koka ref for the reference compiler"
        default: dev-compiler2
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  KOKA_REF: ${{ github.event.inputs.koka-ref || 'dev-compiler2' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest ubuntu for the widest glibc compatibility, as upstream does
          - { os: ubuntu-22.04,     name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: macos-latest,     name: macos-arm64 }
          - { os: macos-15-intel,   name: macos-x64 }

    steps:
      - name: Checkout the port
        uses: actions/checkout@v5
        with:
          submodules: false

      # .gitmodules names mimalloc by an SSH url, which a runner cannot clone
      - name: Submodules over https
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Checkout the reference compiler
        uses: actions/checkout@v5
        with:
          repository: TimWhiting/koka
          ref: ${{ env.KOKA_REF }}
          path: koka-ref
          submodules: recursive

      # vcpkg binary cache: https://learn.microsoft.com/en-us/vcpkg/consume/binary-caching-github-actions-cache
      - name: Setup vcpkg cache
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # libuv comes from vcpkg (lib/std/async/api/uv/evloop.kk); both compilers
      # install it on demand under VCPKG_ROOT
      - name: Setup vcpkg
        run: |
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && [ -x "$VCPKG_INSTALLATION_ROOT/vcpkg" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
            echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          fi

      # isocline (compiler/lib/isocline.kk) is in neither vcpkg nor conan: build
      # the vendored copy into a prefix the compilers search
      - name: Install isocline
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo -E sh scripts/install-isocline.sh /usr/local
          else sh scripts/install-isocline.sh; fi

      - name: Build the reference compiler
        uses: freckle/stack-action@v5
        with:
          working-directory: koka-ref
          test: false
          # replaces the action's default `--pedantic`, which makes every GHC
          # warning an error; the reference compiler is not warning-clean
          stack-build-arguments: "--no-haddock"
          cache-save-always: true

      # stage 1: the reference compiler builds the port (what `./koka` does)
      - name: Stage 1
        run: |
          REF=$(cd koka-ref && stack exec which koka)
          "$REF" --version
          "$REF" --sharedir="$PWD" -i"$PWD" -O2 -c compiler/main/driver.kk
          # the reference compiler names an -O2 build `<cc>-drelease-<hash>`
          STAGE1=$(ls -t .koka/v*/*release-*/compiler_main_driver__main | head -1)
          test -x "$STAGE1"
          echo "STAGE1=$PWD/$STAGE1" >> "$GITHUB_ENV"

      # stage 2: the port builds itself (what `scripts/build-driver.sh --port` does)
      - name: Stage 2
        run: |
          "$STAGE1" -i"$PWD" -O2 -c --buildtag=bootstrap compiler/main/driver.kk
          STAGE2=$(ls -t .koka/v*-bootstrap/*release-*/compiler_main_driver__main | head -1)
          test -x "$STAGE2"
          echo "STAGE2=$PWD/$STAGE2" >> "$GITHUB_ENV"

      - name: Package
        run: |
          DIST="koka-port-${{ matrix.name }}"
          mkdir -p "dist/$DIST/bin"
          cp "$STAGE2" "dist/$DIST/bin/koka"
          cp -R lib "dist/$DIST/lib"
          # the runtime sources, without git metadata or build output
          rsync -a --exclude '.git' --exclude 'out' --exclude 'build' kklib/ "dist/$DIST/kklib/"
          cp LICENSE* README.md "dist/$DIST/" 2>/dev/null || true
          tar -C dist -czf "dist/$DIST.tar.gz" "$DIST"
          echo "DIST=$DIST" >> "$GITHUB_ENV"

      # A positive signal from the PACKAGED compiler, run from outside the
      # checkout: it must find its own lib and kklib, compile, link and run.
      - name: Smoke test
        run: |
          T="$RUNNER_TEMP/smoke"
          mkdir -p "$T" && tar -C "$T" -xzf "dist/$DIST.tar.gz"
          cp samples/basic/caesar.kk "$T/"
          printf 'fun main()\n  println("stage2 ok")\n' > "$T/hello.kk"
          cd "$T"
          "./$DIST/bin/koka" --version
          test "$("./$DIST/bin/koka" -e hello.kk | tail -1)" = "stage2 ok"
          "./$DIST/bin/koka" -e caesar.kk | grep -q "cracked: Koka is a well-typed language"
          echo "packaged stage 2 compiles and runs programs"

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.DIST }}
          path: dist/${{ env.DIST }}.tar.gz

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          prerelease: true
